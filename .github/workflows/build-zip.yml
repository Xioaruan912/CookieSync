name: Build Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build and verify outside the source checkout
        run: node scripts/workspace.mjs verify --cache "$RUNNER_TEMP/cookiesync-cache" --output "$RUNNER_TEMP/cookiesync-release"
      - uses: actions/upload-artifact@v4
        with:
          name: CookieSync-chrome
          path: ${{ runner.temp }}/cookiesync-release/unpacked/*
          if-no-files-found: error
