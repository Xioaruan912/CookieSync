name: Build and release Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build and verify outside the source checkout
        run: node scripts/workspace.mjs verify --cache "$RUNNER_TEMP/cookiesync-cache" --output "$RUNNER_TEMP/cookiesync-release"
      - uses: actions/upload-artifact@v4
        with:
          name: CookieSync-chrome
          path: ${{ runner.temp }}/cookiesync-release/unpacked/*
          if-no-files-found: error
      - name: Save installation ZIP for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ runner.temp }}/cookiesync-release/CookieSync-chrome-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cookiesync-release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release
      - name: Validate installation ZIP and prepare release metadata
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          archives = list(Path('release').glob('CookieSync-chrome-*.zip'))
          assert len(archives) == 1, 'Expected exactly one installation ZIP'
          archive = archives[0]
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None, 'Corrupt installation ZIP'
              manifest = json.loads(bundle.read('manifest.json'))
              version = manifest['version']
              assert re.fullmatch(r'\d+(?:\.\d+){1,3}', version), 'Invalid extension version'
              assert archive.name == f'CookieSync-chrome-{version}.zip', 'Version mismatch'
              for entry in (manifest['background']['service_worker'], manifest['action']['default_popup']):
                  assert entry in bundle.namelist(), f'Missing entry: {entry}'
          Path('release/SHA256SUMS.txt').write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Publish verified installation package to GitHub Releases
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; leave publishing to its build."
            exit 0
          fi
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          下载下方 CookieSync-chrome-${VERSION}.zip，解压后在 chrome://extensions 开启开发者模式，加载包含 manifest.json 的目录。

          更新时覆盖原安装目录并重新加载，保留本机配置。Source code 是源码，请下载安装 ZIP。

          本包已通过构建、类型检查与测试。默认自动推送、自动拉取，每 2 分钟检查变化。

          Cookie / LocalStorage 可能等同登录凭据，请使用私人 HTTPS WebDAV 和数据加密；网站设备风控或会话过期仍可能要求重新登录。

          源码提交：${GITHUB_SHA}
          构建记录：https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "CookieSync ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "release/CookieSync-chrome-${VERSION}.zip" release/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file release-notes.md
