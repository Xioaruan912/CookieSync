name: Build and release Chrome Web Store package

on:
  push:
    branches: [chrome]
    tags: ['chrome-v*']
  pull_request:
    branches: [chrome]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build and verify outside the source checkout
        env:
          __WEBSTORE__: 'true'
        run: node scripts/workspace.mjs verify --cache "$RUNNER_TEMP/cookiesync-cache" --output "$RUNNER_TEMP/cookiesync-release"
      - uses: actions/upload-artifact@v4
        with:
          name: CookieSync-webstore-unpacked
          path: ${{ runner.temp }}/cookiesync-release/unpacked/*
          if-no-files-found: error
      - name: Save Chrome Web Store ZIP for publishing
        uses: actions/upload-artifact@v4
        with:
          name: webstore-zip
          path: ${{ runner.temp }}/cookiesync-release/CookieSync-webstore-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: (github.ref == 'refs/heads/chrome' && github.event_name != 'pull_request') || startsWith(github.ref, 'refs/tags/chrome-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cookiesync-release-chrome
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webstore-zip
          path: release
      - name: Validate Chrome Web Store ZIP and prepare release metadata
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          archives = list(Path('release').glob('CookieSync-webstore-*.zip'))
          assert len(archives) == 1, 'Expected exactly one Chrome Web Store ZIP'
          archive = archives[0]
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None, 'Corrupt Web Store ZIP'
              names = bundle.namelist()
              non_ascii = [name for name in names if not name.isascii()]
              assert not non_ascii, f'Non-ASCII entries are not allowed in CWS ZIP: {non_ascii}'
              manifest = json.loads(bundle.read('manifest.json'))
              assert 'key' not in manifest, 'Chrome Web Store forbids manifest "key" field'
              assert 'downloads' not in manifest.get('permissions', []), 'CWS build must not request downloads permission'
              assert 'web_accessible_resources' not in manifest, 'CWS build should not expose unused web_accessible_resources'
              for entry_name in names:
                  if entry_name.endswith('.js'):
                      code = bundle.read(entry_name).decode('utf-8', errors='ignore')
                      assert not re.search(r'\beval\s*\(|new\s+Function\s*\(', code), f'Disallowed eval/Function in {entry_name}'
              version = manifest['version']
              assert re.fullmatch(r'\d+(?:\.\d+){1,3}', version), 'Invalid extension version'
              assert archive.name == f'CookieSync-webstore-{version}.zip', 'Version mismatch'
              for entry in (manifest['background']['service_worker'], manifest['action']['default_popup']):
                  assert entry in names, f'Missing entry: {entry}'
          Path('release/SHA256SUMS.txt').write_text(
              hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + archive.name + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Publish Chrome Web Store package to GitHub Releases
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          TAG="chrome-v${VERSION}"
          cat > release-notes.md <<EOF
          ### Chrome 应用商店专用上传包（v${VERSION}）

          1. 下载下方 **\`CookieSync-webstore-${VERSION}.zip\`**（已移除 \`manifest.json\` 中的 \`key\` 字段，全部文件均为纯 ASCII 路径，可直接上传至 Chrome Web Store 开发者控制台）。
          2. 登录 [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole) → 选择 CookieSync → **软件包（Package）** → 上传新软件包。
          3. 审核表单（隐私权政策、单一用途说明、权限理由）可参考仓库内 \`docs/CHROME_WEBSTORE.md\`。

          > 注意：本地开发者模式侧载请继续使用 \`main\` 分支发布的 \`CookieSync-chrome-${VERSION}.zip\`。

          <details>
          <summary>校验与构建信息</summary>

          - 完整性校验：可配合附件 \`SHA256SUMS.txt\` 核对 ZIP 哈希。
          - 分支：\`chrome\`
          - 源码提交：\`${GITHUB_SHA}\`
          - 构建记录：https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          </details>
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "CookieSync Chrome Web Store v${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "release/CookieSync-webstore-${VERSION}.zip" release/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --notes-file release-notes.md
