<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="accentArc" x1="160" y1="380" x2="400" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B7BFF"/>
      <stop offset="100%" stop-color="#8AA4FF"/>
    </linearGradient>
  </defs>

  <!-- Refined Apple/Swiss Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="rgba(255,255,255,0.10)" stroke-width="4"/>

  <!-- Upper-Left Crisp White Geometric Sync Arc ("C") -->
  <path
    d="M 334 156 A 126 126 0 1 0 198 368"
    stroke="#FFFFFF"
    stroke-width="46"
    stroke-linecap="round"
  />

  <!-- Lower-Right Periwinkle Interlocking Sync Arc -->
  <path
    d="M 178 356 A 126 126 0 0 0 378 242"
    stroke="url(#accentArc)"
    stroke-width="46"
    stroke-linecap="round"
  />

  <!-- Kinetic Sync Orbital Node -->
  <circle cx="256" cy="256" r="32" fill="#6F8DFF" fill-opacity="0.24"/>
  <circle cx="256" cy="256" r="15" fill="#FFFFFF"/>

  <!-- Precision Endpoint Accent Dot -->
  <circle cx="364" cy="186" r="14" fill="#6F8DFF"/>
</svg>
