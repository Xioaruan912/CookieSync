syntax = "proto3";

message Cookie {
  string domain = 1;
  string name = 2;
  string storeId = 3;
  string value = 4;
  bool session = 5;
  bool hostOnly = 6;
  float expirationDate = 7;
  string path = 8;
  bool httpOnly = 9;
  bool secure = 10;
  string sameSite = 11;
}

message LocalStorageItem {
  string key = 1;
  string value = 2;
  // Exact origin (scheme://host[:port]) that owns this entry. Empty on entries
  // written before 1.16; those are applied to any matching tab of the site.
  string origin = 3;
}

message DomainCookie {
  int64 createTime = 1;
  int64 updateTime = 2;
  repeated Cookie cookies = 5;
  repeated LocalStorageItem localStorageItems = 6;
  string userAgent = 7;
  // Session storage is per tab and per origin, so it rides with the same domain
  // entry instead of a separate file.
  repeated LocalStorageItem sessionStorageItems = 8;
  // 2 when origin-tagged storage exists. Older peers ignore the marker and drop
  // the fields they cannot represent, which the writer reports as a warning.
  uint32 schema = 9;
}

message CookiesMap {
  int64 createTime = 1;
  int64 updateTime = 2;
  map<string, DomainCookie> domainCookieMap = 5;
}
