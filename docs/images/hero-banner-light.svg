<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CookieSync — 换电脑，不用重新登录">
  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F8DFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6F8DFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6F8DFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #FFFFFF; }
      .frame { fill: none; stroke: #E6E6E6; stroke-width: 1; }
      .hairline { stroke: #E6E6E6; stroke-width: 1; }
      .title { font: 400 58px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0A0A0A; letter-spacing: -0.035em; }
      .subtitle { font: 400 18px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #525252; }
      .kicker { font: 500 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #6F8DFF; letter-spacing: 0.14em; }
      .node-title { font: 500 14px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #111111; }
      .node-sub { font: 400 11.5px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #737373; }
      .pill-bg { fill: #F5F7FF; stroke: #DCE4FF; stroke-width: 1; }
      .pill-text { font: 500 12px/1 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #4E6EF2; }
      .card { fill: #FFFFFF; stroke: #E4E4E4; stroke-width: 1; }
      .card-cloud { fill: #F7F9FF; stroke: #D5E0FF; stroke-width: 1; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      .wave-dot { fill: #6F8DFF; transform-box: fill-box; transform-origin: center; animation: pulseDot 2.4s ease-in-out infinite; }
      .d1 { animation-delay: 0.0s; }
      .d2 { animation-delay: 0.2s; }
      .d3 { animation-delay: 0.4s; }
      .d4 { animation-delay: 0.6s; }
      .d5 { animation-delay: 0.8s; }
      .d6 { animation-delay: 1.0s; }
      .d7 { animation-delay: 1.2s; }
      .d8 { animation-delay: 1.4s; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .live-dot { fill: #16A34A; animation: breathe 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Pure Swiss-Tokyo White Canvas -->
  <rect class="bg" x="0" y="0" width="1200" height="320" rx="16"/>
  <rect class="frame" x="0.5" y="0.5" width="1199" height="319" rx="16"/>

  <!-- Subtle editorial top/bottom structural hairlines -->
  <line class="hairline" x1="56" y1="54" x2="1144" y2="54"/>
  <line class="hairline" x1="56" y1="268" x2="1144" y2="268"/>

  <!-- Top meta bar -->
  <circle class="live-dot" cx="64" cy="30" r="4"/>
  <text x="78" y="34" class="node-sub">双机自动交接 · 115 防掉线护盾 · 隐私端到端加密</text>
  <text x="1144" y="34" text-anchor="end" class="kicker">COOKIESYNC 2.0</text>

  <!-- Left Editorial Typography -->
  <text x="56" y="138" class="title">CookieSync</text>
  <text x="56" y="182" class="subtitle">换电脑，不用重新登录。</text>
  <text x="56" y="210" class="node-sub">自动识别你正在使用的那台电脑，静默同步登录状态，闲置机自动待机防互踢。</text>

  <!-- Feature Pills -->
  <rect class="pill-bg" x="56" y="228" width="96" height="26" rx="13"/>
  <text x="104" y="245" text-anchor="middle" class="pill-text">零感交接</text>

  <rect class="pill-bg" x="162" y="228" width="104" height="26" rx="13"/>
  <text x="214" y="245" text-anchor="middle" class="pill-text">115 防掉线</text>

  <rect class="pill-bg" x="276" y="228" width="108" height="26" rx="13"/>
  <text x="330" y="245" text-anchor="middle" class="pill-text">私人云加密</text>

  <!-- Right Kinetic Sync Stage -->
  <!-- Track line -->
  <line x1="650" y1="160" x2="1080" y2="160" stroke="#E5EAFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Traveling sync beam A -> Cloud -> B -->
  <circle r="4.5" fill="#6F8DFF" filter="url(#soft-glow)">
    <animate attributeName="cx" values="670;865;1060;1060" keyTimes="0;0.45;0.9;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;160;160" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#6F8DFF" opacity="0.55">
    <animate attributeName="cx" values="670;865;1060;1060" keyTimes="0;0.45;0.9;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;160;160" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.85;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: PC A -->
  <g transform="translate(590, 114)">
    <rect class="card" x="0" y="0" width="136" height="92" rx="14"/>
    <circle class="live-dot" cx="20" cy="24" r="4"/>
    <text x="32" y="28" class="node-title">电脑 A</text>
    <text x="20" y="54" class="node-sub">当前正在使用</text>
    <text x="20" y="74" class="pill-text">自动上传变化</text>
  </g>

  <!-- Node 2: Private Cloud -->
  <g transform="translate(804, 106)">
    <rect class="card-cloud" x="0" y="0" width="122" height="108" rx="18"/>
    <circle cx="61" cy="40" r="16" fill="none" stroke="#6F8DFF" stroke-width="1.2" opacity="0.35">
      <animate attributeName="r" values="14;22;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.05;0.55" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="61" cy="40" r="10" fill="#6F8DFF" opacity="0.16"/>
    <circle cx="61" cy="40" r="4.5" fill="#6F8DFF"/>
    <text x="61" y="74" text-anchor="middle" class="node-title">私人云端</text>
    <text x="61" y="92" text-anchor="middle" class="node-sub">加密同步中转</text>
  </g>

  <!-- Node 3: PC B -->
  <g transform="translate(1004, 114)">
    <rect class="card" x="0" y="0" width="140" height="92" rx="14"/>
    <circle cx="20" cy="24" r="4" fill="#6F8DFF"/>
    <text x="32" y="28" class="node-title">电脑 B</text>
    <text x="20" y="54" class="node-sub">切换即刻接班</text>
    <text x="20" y="74" class="node-sub">开网页直接已登录</text>
  </g>

  <!-- Bottom kinetic dot wave -->
  <g transform="translate(56, 294)">
    <text x="0" y="4" class="node-sub">支持 Chrome / Edge 等 Chromium 浏览器</text>
    <g transform="translate(940, 0)">
      <circle class="wave-dot d1" cx="0" cy="0" r="2.8"/>
      <circle class="wave-dot d2" cx="20" cy="0" r="2.8"/>
      <circle class="wave-dot d3" cx="40" cy="0" r="2.8"/>
      <circle class="wave-dot d4" cx="60" cy="0" r="2.8"/>
      <circle class="wave-dot d5" cx="80" cy="0" r="2.8"/>
      <circle class="wave-dot d6" cx="100" cy="0" r="2.8"/>
      <circle class="wave-dot d7" cx="120" cy="0" r="2.8"/>
      <circle class="wave-dot d8" cx="140" cy="0" r="2.8"/>
    </g>
  </g>
</svg>
